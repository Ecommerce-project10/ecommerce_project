<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Wishlist</title>
  <style>
    .fixed-img {
      height: 200px;
      object-fit: contain; 
      background-color: #fff; 
      padding: 10px;
    }
    .card {
      text-align: center;
    }
  </style>
  
</head>
<body style="font-family: 'Inter', sans-serif;">

  {% include 'navbar.html' %}
  {% include 'message.html' %}
  <div class="container py-5">
    <h1 class="text-center mb-5 text-white">My Wishlist</h1>
    <div class="row justify-content-center g-4">
      {% for item in saved_item %}
      <div class="col-md-4 col-sm-6 d-flex">
        <div class="card shadow-sm h-100 w-100">
          <img src="{{ item.image }}" class="card-img-top fixed-img" alt="Product">
          <div class="card-body d-flex flex-column align-items-center">
            <h5 class="card-title">{{ item.name }}</h5>
            <p class="text-success fw-bold fs-5 mb-2">${{ item.price }}</p>
            <a href="{% url 'remove_saved_item' item.product_id %}" 
                class="btn btn-danger mt-auto w-75">
              <i class="fa-solid fa-trash me-2"></i> Remove
            </a>
            
            <a href="{% url 'product_detail' item.product_id %}" 
                class="btn btn-primary mt-2 w-75">
              <i class="fa-solid fa-eye me-2"></i> View Product
            </a>
         
          </div>
        </div>
      </div>
      {%empty%}
      <div class="text-center text-white">
        <p>No items in your wishlist yet.</p>
      </div>
      {% endfor %}
    </div>
  </div>
</body>
</html>
